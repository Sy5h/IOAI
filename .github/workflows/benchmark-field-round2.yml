name: IOAI Field round 2 CPU benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-round2-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU-only dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.3 matplotlib==3.10.6
      - name: Select on public generated holdouts and re-evaluate released A/B
        run: python tools/benchmark_field_round2.py --work-dir work/field-round2
      - name: Retain scores, commands, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-round2-cpu-results
          path: |
            work/field-round2/summary.json
            work/field-round2/provenance.json
            work/field-round2/*/*.log
            work/field-round2/*/*.json
          if-no-files-found: warn
          retention-days: 14
