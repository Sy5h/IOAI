name: Public IOAI Field CPU benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-field-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU-only benchmark dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.3 matplotlib==3.10.6
      - name: Select steps on public holdouts, then benchmark released configurations
        run: python tools/benchmark_field.py --work-dir work/field-benchmark
      - name: Retain scores, commands, timing, and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-field-cpu-results
          path: |
            work/field-benchmark/summary.json
            work/field-benchmark/provenance.json
            work/field-benchmark/*/*.log
            work/field-benchmark/*/*.json
          if-no-files-found: warn
          retention-days: 14
